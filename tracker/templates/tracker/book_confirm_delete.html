<!DOCTYPE html>
<html>
<head><title>Delete {{ book.title }}</title></head>
<body>
    <h1>Delete "{{ book.title }}"?</h1>
    <p style="color: red;">Are you sure you want to delete this book? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>
    <a href="{% url 'book_detail' book.id %}">Cancel</a>xs
</body>
</html>
