{% extends 'tracker/base.html' %}

{% block title %}Delete {{ book.title }}{% endblock %}

{% block content %}
    <div class="confirm-delete">Remove "{{ book.title }}" from the shelf?</div>
    <p class="confirm-warn">This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn">Yes, remove it</button>
    </form>
    <a class="back" href="{% url 'book_detail' book.id %}">Cancel</a>
{% endblock %}
